name: Reusable Godot (branch 66) Build

on:
  workflow_call:
    inputs:
      godot_ref:
        description: Godot git ref to build
        required: true
        type: string
      build_name:
        description: BUILD_NAME env value used by the build
        required: true
        type: string
      godot_repo:
        description: Godot repository to clone
        required: false
        default: gongpha/godot
        type: string
      include_ggml:
        description: Include ggml modules (llama.cpp, whisper.cpp)
        required: false
        default: false
        type: boolean

env:
  GODOT_REPO: ${{ inputs.godot_repo }}
  GODOT_REF: ${{ inputs.godot_ref }}
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
  BUILD_NAME: ${{ inputs.build_name }}

jobs:
  # ========== Windows ==========
  windows:
    runs-on: windows-latest
    name: 🪟 ${{ matrix.name }}
    timeout-minutes: 240
    env:
      SCONS_CACHE_MSVC_CONFIG: true
      PYTHONIOENCODING: utf8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor
            cache-name: windows-editor
            target: editor
            scons-flags: windows_subsystem=console
            bin: ./godot/bin/godot66.windows.editor.x86_64.exe

          - name: Template (Release)
            cache-name: windows-template
            target: template_release
            scons-flags: ""
            bin: ./godot/bin/godot66.windows.template_release.x86_64.console.exe

    steps:
      - name: Clone Godot (66)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GODOT_REPO }}
          ref: ${{ env.GODOT_REF }}
          path: godot

      - name: Clone module - 66 (private)
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot66-module-private
          token: ${{ secrets.MODULE_TOKEN }}
          path: modules/66

      - name: Clone module - sanctuary (private)
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot66-sanctuary
          token: ${{ secrets.MODULE_TOKEN }}
          path: modules/sanctuary

      - name: Clone module - Steam Audio (private)
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot66-steam-audio
          token: ${{ secrets.MODULE_TOKEN }}
          path: modules/phonon

      - name: Clone module - llama
        if: ${{ inputs.include_ggml }}
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot-module-llama-cpp
          submodules: recursive
          path: modules/llama

      - name: Clone module - whisper
        if: ${{ inputs.include_ggml }}
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot-whisper-cpp
          submodules: recursive
          path: modules/whisper

      - name: Clone module - godotsteam (fork)
        run: git clone https://github.com/gongpha/godotsteam.git modules/godotsteam

      - name: Clone SteamworksSDK (v1.65a)
        uses: actions/checkout@v7
        with:
          repository: rlabrecque/SteamworksSDK
          ref: df2baabf574a738ef1ea90a7e89339107fc0a279 # v1.65 (a)
          path: modules/godotsteam/sdk

      - name: Restore Godot build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: ${{ matrix.cache-name }}|${{ github.ref_name }}|${{ github.sha }}
          restore-keys: |
            ${{ matrix.cache-name }}|${{ github.ref_name }}
            ${{ matrix.cache-name }}|
        continue-on-error: true

      # Paired with the purge before the save below: anything the build did not touch is
      # dropped, so the cache stops growing without bound and getting evicted wholesale.
      - name: Store unix timestamp
        shell: sh
        run: echo "CACHE_TIMESTAMP=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Python and SCons
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install SCons
        # Pinned to match godot's .github/actions/godot-deps. An unpinned SCons means a
        # release build can break on somebody else's upload.
        run: pip install scons==4.10.1

      - name: Setup problem matchers
        shell: bash
        run: echo ::add-matcher::godot/misc/utility/problem-matchers.json

      - name: Fetch Steam Audio SDK
        run: python modules/phonon/scripts/fetch_steam_audio.py modules/phonon/steamaudio_lib/4.8.1/steamaudio/steamaudio

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        working-directory: godot
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Direct3D 12 SDK components
        id: d3d12-sdk
        working-directory: godot
        run: |
          python ./misc/scripts/install_d3d12_sdk_windows.py
          if ($LASTEXITCODE -eq 0) {
            echo "D3D12_ENABLED=yes" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "Direct3D 12 SDK installation failed, building without D3D12 support."
            echo "D3D12_ENABLED=no" >> $env:GITHUB_OUTPUT
          }

      # The engine owns the ANGLE version now (misc/scripts/install_angle.py). This used
      # to fetch a hardcoded tags/chromium/6601.2 release asset by hand; upstream has since
      # moved to chromium/7219 AND renamed the asset, so the hardcoded copy was pinning us
      # to an ancient ANGLE at best.
      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        working-directory: godot
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        working-directory: godot
        run: |
          scons platform=windows target=${{ matrix.target }} production=yes ${{ matrix.scons-flags }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} "custom_modules=${{ github.workspace }}/modules" "cache_path=${{ env.SCONS_CACHE }}" redirect_build_objects=no

      - name: Purge cache files before timestamp
        shell: sh
        run: python godot/misc/scripts/purge_cache.py "$CACHE_TIMESTAMP" "${{ env.SCONS_CACHE }}"
        continue-on-error: true

      - name: Save Godot build cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: ${{ matrix.cache-name }}|${{ github.ref_name }}|${{ github.sha }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          Remove-Item godot/bin/* -Include *.exp,*.lib,*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item godot/bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item godot/bin/obj -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item godot/bin/gen -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item godot/bin/vulkan-shaders-gen.exe -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cache-name }}
          path: godot/bin/*
          retention-days: 60

  # ========== Linux ==========
  linux:
    runs-on: ubuntu-22.04
    name: 🐧 ${{ matrix.name }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor
            cache-name: linux-editor
            target: editor
            scons-flags: ""
            bin: ./godot/bin/godot66.linuxbsd.editor.x86_64

          - name: Template (Release)
            cache-name: linux-template
            target: template_release
            scons-flags: ""
            bin: ./godot/bin/godot66.linuxbsd.template_release.x86_64

    steps:
      - name: Clone Godot (66)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GODOT_REPO }}
          ref: ${{ env.GODOT_REF }}
          path: godot

      - name: Clone module - 66 (private)
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot66-module-private
          token: ${{ secrets.MODULE_TOKEN }}
          path: modules/66

      - name: Clone module - sanctuary (private)
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot66-sanctuary
          token: ${{ secrets.MODULE_TOKEN }}
          path: modules/sanctuary

      - name: Clone module - Steam Audio (private)
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot66-steam-audio
          token: ${{ secrets.MODULE_TOKEN }}
          path: modules/phonon

      - name: Clone module - llama
        if: ${{ inputs.include_ggml }}
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot-module-llama-cpp
          submodules: recursive
          path: modules/llama

      - name: Clone module - whisper
        if: ${{ inputs.include_ggml }}
        uses: actions/checkout@v7
        with:
          repository: gongpha/godot-whisper-cpp
          submodules: recursive
          path: modules/whisper

      - name: Clone module - godotsteam (fork)
        run: git clone https://github.com/gongpha/godotsteam.git modules/godotsteam

      - name: Clone SteamworksSDK (v1.65a)
        uses: actions/checkout@v7
        with:
          repository: rlabrecque/SteamworksSDK
          ref: df2baabf574a738ef1ea90a7e89339107fc0a279 # v1.65 (a)
          path: modules/godotsteam/sdk

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin

      - name: Free disk space on runner
        run: |
          echo "Disk usage before:" && df -h
          sudo rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

      - name: Restore Godot build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: ${{ matrix.cache-name }}|${{ github.ref_name }}|${{ github.sha }}
          restore-keys: |
            ${{ matrix.cache-name }}|${{ github.ref_name }}
            ${{ matrix.cache-name }}|
        continue-on-error: true

      # Paired with the purge before the save below: anything the build did not touch is
      # dropped, so the cache stops growing without bound and getting evicted wholesale.
      - name: Store unix timestamp
        shell: sh
        run: echo "CACHE_TIMESTAMP=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Python and SCons
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install SCons
        # Pinned to match godot's .github/actions/godot-deps. An unpinned SCons means a
        # release build can break on somebody else's upload.
        run: pip install scons==4.10.1

      - name: Setup problem matchers
        shell: bash
        run: echo ::add-matcher::godot/misc/utility/problem-matchers.json

      - name: Fetch Steam Audio SDK
        run: python modules/phonon/scripts/fetch_steam_audio.py modules/phonon/steamaudio_lib/4.8.1/steamaudio/steamaudio

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        working-directory: godot
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        working-directory: godot
        run: |
          scons platform=linuxbsd target=${{ matrix.target }} production=yes ${{ matrix.scons-flags }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} "custom_modules=${{ github.workspace }}/modules" "cache_path=${{ env.SCONS_CACHE }}" redirect_build_objects=no

      - name: Purge cache files before timestamp
        shell: sh
        run: python godot/misc/scripts/purge_cache.py "$CACHE_TIMESTAMP" "${{ env.SCONS_CACHE }}"
        continue-on-error: true

      - name: Save Godot build cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: ${{ matrix.cache-name }}|${{ github.ref_name }}|${{ github.sha }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          rm -rf godot/bin/build_deps godot/bin/obj godot/bin/gen godot/bin/vulkan-shaders-gen
          strip godot/bin/godot66.*
          chmod +x godot/bin/godot66.*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cache-name }}
          path: godot/bin/*
          retention-days: 60